backend:
  name: turbo-github
  turbo_site_id: 435dd0c3-96db-4e39-8c09-fe2a0f6a9da2 # Paste your Site ID from Decap Turbo

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    fields:
      - {label: "Title", name: "title", widget: "string"}
      - {label: "Body", name: "body", widget: "markdown"}
